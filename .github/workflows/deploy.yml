name: Deploy thelistofus.com

# Every push to main is built here and switched to on the Droplet (which is too small to
# build Next.js while serving its other apps). The build's SHA-256 is posted as a commit
# status, and the Droplet only accepts a build that matches it (deploy/thelistofus-deploy).
# The deploy key can do nothing but hand over a build (deploy/deploy-gate). One-time
# server setup: deploy/setup-server.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-thelistofus
  cancel-in-progress: false

env:
  HOST: 143.198.147.77

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the deploy secrets are set
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Add DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (printed by deploy/setup-server.sh) as repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Public settings baked into the pages (optional; lib/site.ts has defaults).
          NEXT_PUBLIC_APP_STORE_ID: ${{ vars.NEXT_PUBLIC_APP_STORE_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf "$RUNNER_TEMP/build.tar.gz" -C .next/standalone .
          ls -lh "$RUNNER_TEMP/build.tar.gz"

      - name: Post the build's checksum on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/build.tar.gz" | cut -d' ' -f1)
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=deploy/build-sha256 -f "description=sha256:${digest}" >/dev/null
          echo "sha256:${digest}"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Send the build to the Droplet and switch to it
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "thelistofus-deploy@${HOST}" "release ${GITHUB_SHA}" \
            < "$RUNNER_TEMP/build.tar.gz"

      - name: Check thelistofus.com is serving this commit
        run: |
          for i in $(seq 1 12); do
            live=$(curl -fsS https://thelistofus.com/api/version | python3 -c 'import json,sys;print(json.load(sys.stdin)["commit"])' || true)
            [ "$live" = "$GITHUB_SHA" ] && { echo "thelistofus.com is serving $GITHUB_SHA."; exit 0; }
            sleep 5
          done
          echo "::error::thelistofus.com is serving ${live:-nothing}, not $GITHUB_SHA"
          exit 1

      - name: Check the app-link file
        run: curl -fsS https://thelistofus.com/.well-known/apple-app-site-association | python3 -m json.tool

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
